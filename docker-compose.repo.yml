# =============================================================================
#  REPO OVERLAY — source-code context (read-only)
#    (split out of the former docker-compose.enterprise.yml)
#
#  Standard bring-up component. Read-only repo/PR/commit context for the agents.
#   * mcp-github     — GitHub's official MCP (read-only + lockdown), exposed over
#                      SSE via a supergateway wrapper (the binary is stdio-only).
#   * mcp-bitbucket  — Bitbucket Cloud MCP (read-only).
# =============================================================================

networks:
  ai-internal:
    name: ai-internal
    external: true

services:

  # --- GitHub MCP (official): repos / PRs / commits, READ-ONLY + LOCKDOWN ------
  #     The official binary is stdio-only, so a supergateway wrapper (built in
  #     ./mcp-github) re-exposes it as SSE on ai-internal.
  mcp-github:
    build:
      context: ./mcp-github
    image: mcp-github-sse:local
    container_name: mcp-github
    restart: unless-stopped
    networks: [ai-internal]
    environment:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_MCP_PAT}"
      GITHUB_READ_ONLY: "1"                 # no writes, ever
      GITHUB_LOCKDOWN_MODE: "1"             # don't surface untrusted public content
      GITHUB_TOOLSETS: "repos,issues,pull_requests"
    # SSE endpoint -> http://mcp-github:8081/sse
    deploy:
      resources:
        limits:
          memory: 384m

  # --- Bitbucket Cloud MCP (read-only) ----------------------------------------
  #     Bitbucket is CLOUD-hosted.
  #     AUTH NOTE: Atlassian App Passwords are DEPRECATED (June 2026). Use a
  #     scoped API token (starts with ATATT) as BITBUCKET_API_TOKEN.
  mcp-bitbucket:
    image: ghcr.io/ibrahimogod/bitbucket-mcp:latest
    container_name: mcp-bitbucket
    restart: unless-stopped
    networks: [ai-internal]
    environment:
      BITBUCKET_API_USERNAME: "${BITBUCKET_API_USERNAME}"   # your Atlassian email
      BITBUCKET_API_TOKEN: "${BITBUCKET_API_TOKEN}"         # scoped ATATT token
      BITBUCKET_WORKSPACE: "${BITBUCKET_WORKSPACE}"
    # MCP endpoint -> http://mcp-bitbucket:8080  (verify path against the image README)
    deploy:
      resources:
        limits:
          memory: 256m
